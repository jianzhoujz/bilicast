name: Native macOS App Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag or ref name"
        required: false
        default: ""
        type: string
  pull_request:
    branches: [main]
    paths:
      - "macos/**"
      - ".github/workflows/macos-native-app-build.yml"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-native-macos-app:
    name: Build native Swift macOS app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-ci"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved native macOS app version: $VERSION"

      - uses: actions/setup-go@v6
        with:
          go-version-file: crossplatform/go.mod
          cache-dependency-path: crossplatform/go.sum

      - name: Swift version
        run: swift --version

      - name: Sync native source version
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          app_version = os.environ['APP_VERSION']
          p = Path('Sources/BiliCastCore/Version.swift')
          s = p.read_text()
          s = re.sub(r'public static let version = "[^"]+"', f'public static let version = "{app_version}"', s)
          p.write_text(s)
          PY

      - name: Build native app bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_BUILD: ${{ github.run_number }}
        run: ./build.sh

      - name: Package app zip and simple dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ../bin dist
          test -x build/BiliCast.app/Contents/Resources/ffmpeg
          ditto -c -k --sequesterRsrc --keepParent build/BiliCast.app "../bin/BiliCast-${VERSION}-macOS-universal.zip"
          shasum -a 256 "../bin/BiliCast-${VERSION}-macOS-universal.zip" | awk '{print $1}' > "../bin/BiliCast-${VERSION}-macOS-universal.zip.sha256"

          rm -rf build/native-dmg-stage
          mkdir -p build/native-dmg-stage
          cp -R build/BiliCast.app build/native-dmg-stage/

          hdiutil create \
            -volname "BiliCast" \
            -srcfolder build/native-dmg-stage \
            -ov \
            -format UDZO \
            "../bin/BiliCast-${VERSION}.dmg"
          shasum -a 256 "../bin/BiliCast-${VERSION}.dmg" | awk '{print $1}' > "../bin/BiliCast-${VERSION}.dmg.sha256"

          ls -lh ../bin

      - name: Upload native macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-macos-universal
          path: |
            bin/BiliCast-*-macOS-universal.zip
            bin/BiliCast-*-macOS-universal.zip.sha256
            bin/BiliCast-*.dmg
            bin/BiliCast-*.dmg.sha256

      - name: Attach native macOS artifacts to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            bin/BiliCast-*-macOS-universal.zip
            bin/BiliCast-*-macOS-universal.zip.sha256
            bin/BiliCast-*.dmg
            bin/BiliCast-*.dmg.sha256
          append_body: true
          body: |

            ---

            ## Native macOS app

            - `BiliCast-VERSION.dmg`
            - `BiliCast-VERSION-macOS-universal.zip`
            - SHA256 checksum files are included for both artifacts.
