name: Wails Build

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag or ref name"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows amd64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crossplatform
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: crossplatform/go.mod
          cache-dependency-path: crossplatform/go.sum

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path ..\tmp, ..\bin | Out-Null
          $zip = "..\tmp\ffmpeg-windows.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          Expand-Archive -Force $zip -DestinationPath ..\tmp\ffmpeg
          $ffmpeg = Get-ChildItem ..\tmp\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) {
            Write-Error "ffmpeg.exe not found in downloaded archive"
            exit 1
          }
          Copy-Item $ffmpeg.FullName ..\bin\ffmpeg.exe
          if ((Get-Item ..\bin\ffmpeg.exe).Length -lt 1000000) {
            Write-Error "downloaded ffmpeg.exe is suspiciously small"
            exit 1
          }

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build Wails app
        run: wails build -tags wails -platform windows/amd64 -clean

      - name: Package executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path ..\bin | Out-Null
          $exe = Get-ChildItem build\bin -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Windows executable not found"
            Get-ChildItem build\bin -Recurse -ErrorAction SilentlyContinue
            exit 1
          }
          New-Item -ItemType Directory -Force -Path ..\bin\windows-amd64 | Out-Null
          Copy-Item $exe.FullName ..\bin\windows-amd64\BiliCast.exe
          Copy-Item ..\bin\ffmpeg.exe ..\bin\windows-amd64\ffmpeg.exe
          Compress-Archive -Force -Path ..\bin\windows-amd64\* -DestinationPath ..\bin\BiliCast-windows-amd64.zip
          Get-FileHash -Algorithm SHA256 ..\bin\BiliCast-windows-amd64.zip | ForEach-Object { $_.Hash.ToLower() } | Out-File -Encoding ascii ..\bin\BiliCast-windows-amd64.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: wails-windows-amd64
          path: |
            bin/BiliCast-windows-amd64.zip
            bin/BiliCast-windows-amd64.zip.sha256

  build-linux:
    name: Build Linux amd64
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: crossplatform
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: crossplatform/go.mod
          cache-dependency-path: crossplatform/go.sum

      - name: Install Linux Wails dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev xz-utils

      - name: Download ffmpeg
        run: |
          set -euo pipefail
          mkdir -p ../tmp ../bin
          curl -fL --retry 3 --retry-delay 2 -o ../tmp/ffmpeg-linux.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xJf ../tmp/ffmpeg-linux.tar.xz -C ../tmp
          FFMPEG=$(find ../tmp -type f -name ffmpeg -perm -111 | head -n 1)
          if [ -z "$FFMPEG" ]; then
            echo "ffmpeg not found in downloaded archive" >&2
            find ../tmp -maxdepth 3 -type f | sed -n '1,80p'
            exit 1
          fi
          cp "$FFMPEG" ../bin/ffmpeg
          chmod +x ../bin/ffmpeg
          test $(wc -c < ../bin/ffmpeg) -gt 1000000

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build Wails app
        run: wails build -tags wails -platform linux/amd64 -clean

      - name: Package binary
        run: |
          set -euo pipefail
          mkdir -p ../bin
          BIN=$(find build/bin -maxdepth 1 -type f -perm -111 | head -n 1)
          if [ -z "$BIN" ]; then
            echo "Linux binary not found" >&2
            find build/bin -maxdepth 2 -print
            exit 1
          fi
          mkdir -p ../bin/linux-amd64
          cp "$BIN" ../bin/linux-amd64/BiliCast
          cp ../bin/ffmpeg ../bin/linux-amd64/ffmpeg
          chmod +x ../bin/linux-amd64/BiliCast ../bin/linux-amd64/ffmpeg
          (cd ../bin && zip -r BiliCast-linux-amd64.zip linux-amd64)
          python3 -c "import zipfile; z=zipfile.ZipFile('../bin/BiliCast-linux-amd64.zip'); names=set(z.namelist()); assert 'linux-amd64/BiliCast' in names; assert 'linux-amd64/ffmpeg' in names"
          sha256sum ../bin/BiliCast-linux-amd64.zip | awk '{print $1}' > ../bin/BiliCast-linux-amd64.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: wails-linux-amd64
          path: |
            bin/BiliCast-linux-amd64.zip
            bin/BiliCast-linux-amd64.zip.sha256

  build-macos:
    name: Build macOS universal
    runs-on: macos-latest
    defaults:
      run:
        working-directory: crossplatform
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: crossplatform/go.mod
          cache-dependency-path: crossplatform/go.sum

      - name: Fetch universal ffmpeg
        run: |
          set -euo pipefail
          mkdir -p ../bin
          ../macos/tools/fetch-ffmpeg.sh ../bin/ffmpeg
          test -x ../bin/ffmpeg
          test $(wc -c < ../bin/ffmpeg) -gt 1000000

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build Wails app
        run: wails build -tags wails -platform darwin/universal -clean

      - name: Rename app, patch Info.plist, bundle ffmpeg, ad-hoc sign
        run: |
          set -euo pipefail
          SRC=$(find build/bin -maxdepth 1 -type d -name "*.app" | head -n 1)
          if [ -z "$SRC" ]; then
            echo "macOS .app bundle not found" >&2
            find build/bin -maxdepth 2 -print
            exit 1
          fi
          APP="build/bin/BiliCast-wails.app"
          if [ "$SRC" != "$APP" ]; then
            mv "$SRC" "$APP"
          fi
          # Differentiate from native BiliCast.app: distinct bundle id + display name.
          PB=/usr/libexec/PlistBuddy
          PLIST="$APP/Contents/Info.plist"
          $PB -c "Set :CFBundleIdentifier com.wails.bilicast-wails" "$PLIST"
          $PB -c "Set :CFBundleName BiliCast Wails" "$PLIST"
          $PB -c "Add :CFBundleDisplayName string BiliCast (Wails)" "$PLIST" 2>/dev/null \
            || $PB -c "Set :CFBundleDisplayName BiliCast (Wails)" "$PLIST"
          mkdir -p "$APP/Contents/Resources"
          # Replace Wails' generated icon with the native app's high-quality icns
          # (Wails' PNG → icns conversion adds black padding at small sizes).
          cp ../macos/Resources/AppIcon.icns "$APP/Contents/Resources/iconfile.icns"
          cp ../bin/ffmpeg "$APP/Contents/Resources/ffmpeg"
          chmod +x "$APP/Contents/Resources/ffmpeg"
          codesign --force --deep --sign - "$APP"

      - name: Build macOS DMG
        run: |
          set -euo pipefail
          mkdir -p ../bin
          rm -rf build/dmg-stage
          mkdir -p build/dmg-stage
          cp -R build/bin/BiliCast-wails.app build/dmg-stage/
          hdiutil create \
            -volname "BiliCast (Wails)" \
            -srcfolder build/dmg-stage \
            -ov \
            -format UDZO \
            ../bin/BiliCast-macOS-universal-wails.dmg
          shasum -a 256 ../bin/BiliCast-macOS-universal-wails.dmg | awk '{print $1}' > ../bin/BiliCast-macOS-universal-wails.dmg.sha256
          ls -lh ../bin

      - uses: actions/upload-artifact@v7
        with:
          name: wails-macos-universal
          path: |
            bin/BiliCast-macOS-universal-wails.dmg
            bin/BiliCast-macOS-universal-wails.dmg.sha256

  create-release-assets:
    name: Attach Wails artifacts to release
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: wails-*
          merge-multiple: true

      - name: Generate latest.json
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp artifacts/* release-assets/
          TAG="${{ inputs.tag || github.ref_name }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          cat > release-assets/latest.json <<JSON
          {
            "version": "${TAG}",
            "release_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "files": {
              "windows-amd64": { "name": "BiliCast-windows-amd64.zip", "url": "${BASE_URL}/BiliCast-windows-amd64.zip" },
              "linux-amd64": { "name": "BiliCast-linux-amd64.zip", "url": "${BASE_URL}/BiliCast-linux-amd64.zip" },
              "macos-universal-wails": { "name": "BiliCast-macOS-universal-wails.dmg", "url": "${BASE_URL}/BiliCast-macOS-universal-wails.dmg" }
            }
          }
          JSON
          ls -lh release-assets

      - name: Remove existing Wails assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release delete-asset "$TAG" BiliCastHelper-windows-amd64.exe --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCastHelper-windows-amd64.exe.sha256 --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCastHelper-windows-amd64.zip --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCastHelper-windows-amd64.zip.sha256 --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCast-windows-amd64.zip --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCast-windows-amd64.zip.sha256 --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCastHelper-linux-amd64 --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCastHelper-linux-amd64.sha256 --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCastHelper-linux-amd64.tar.gz --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCastHelper-linux-amd64.tar.gz.sha256 --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCastHelper-linux-amd64.zip --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCastHelper-linux-amd64.zip.sha256 --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCast-linux-amd64.zip --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCast-linux-amd64.zip.sha256 --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCastHelper-macOS-universal.zip --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCastHelper-macOS-universal.zip.sha256 --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCastHelper-macOS-universal-wails.zip --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCastHelper-macOS-universal-wails.zip.sha256 --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCast-macOS-universal-wails.dmg --repo "${{ github.repository }}" -y || true
          gh release delete-asset "$TAG" BiliCast-macOS-universal-wails.dmg.sha256 --repo "${{ github.repository }}" -y || true

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release-assets/*
          append_body: true
          body: |

            ---

            ## Wails desktop builds

            - Windows green package: `BiliCast-windows-amd64.zip` (contains `BiliCast.exe` + ffmpeg sidecar)
            - Linux green package: `BiliCast-linux-amd64.zip` (contains `BiliCast` + ffmpeg sidecar)
            - macOS Wails DMG (coexists with native `BiliCast.app`): `BiliCast-macOS-universal-wails.dmg` (contains universal `BiliCast-wails.app` with embedded ffmpeg)
            - Every artifact includes a `.sha256` checksum file.
