<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>BiliCastHelper</title>
  <style>
    body {
      box-sizing: border-box;
      width: 300px;
      margin: 0;
      padding: 14px;
      color: #18191c;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #fff;
    }
    h1 { margin: 0 0 10px; font-size: 15px; }
    label { display: block; margin: 10px 0 6px; font-weight: 600; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 7px 8px;
      border: 1px solid #d6d8db;
      border-radius: 6px;
      font: inherit;
    }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button {
      flex: 1;
      border: 1px solid #d6d8db;
      background: #fff;
      color: #18191c;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
    }
    button.primary { background: #fb7299; border-color: #fb7299; color: #fff; }
    #status { margin-top: 10px; color: #61666d; white-space: pre-wrap; }
    .hint { margin-top: 8px; color: #9499a0; font-size: 12px; }
  </style>
</head>
<body>
  <h1>BiliCastHelper</h1>
  <div id="health">正在检查本地服务…</div>
  <label for="token">Pairing Token</label>
  <input id="token" type="password" autocomplete="off" placeholder="粘贴菜单栏 App 里的 Token">
  <div class="row">
    <button id="save" class="primary">保存</button>
    <button id="clear">清除</button>
  </div>
  <div id="status"></div>
  <div class="hint">保存后打开 B 站视频页，页面右下角会出现“投屏”按钮。</div>
  <script src="popup.js"></script>
</body>
</html>
