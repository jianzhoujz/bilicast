<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BiliCast</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f7f8;
      color: #18191c;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    }
    main {
      width: min(360px, calc(100vw - 28px));
      text-align: center;
      padding: 14px;
    }
    h1 { margin: 0 0 6px; font-size: 17px; font-weight: 650; }
    p { margin: 4px 0; }
    a {
      display: inline-block;
      margin-top: 10px;
      border-radius: 6px;
      background: #fb7299;
      color: #fff;
      padding: 6px 12px;
      text-decoration: none;
      font-weight: 600;
    }
    .muted { color: #6b7280; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1d22; color: #f1f2f3; }
      .muted { color: #a5adba; }
    }
  </style>
</head>
<body>
  <main>
    <h1>BiliCast</h1>
    <p class="muted">正在打开控制台…</p>
    <a id="console-link" href="http://127.0.0.1:18787/console">打开控制台</a>
  </main>
  <script>
    const consoleURL = 'http://127.0.0.1:18787/console';
    document.getElementById('console-link').href = consoleURL;
    setTimeout(() => {
      window.location.replace(consoleURL);
    }, 200);
  </script>
</body>
</html>
